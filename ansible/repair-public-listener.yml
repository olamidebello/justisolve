---
- name: Repair JustiSolve public IPv4 SNI selection using its existing certificate
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Require the operator selected server address
      ansible.builtin.assert:
        that: repair_public_ipv4 is defined
        fail_msg: Supply -e repair_public_ipv4=the_server_ipv4
    - name: Back up and repair only matching JustiSolve TLS listeners
      ansible.builtin.command:
        argv: [python3, '{{ playbook_dir }}/../scripts/repair-public-listener.py', --address, '{{ repair_public_ipv4 }}']
      register: listener_repair
      changed_when: '(listener_repair.stdout | from_json).changed'
    - name: Report verified public address TLS
      ansible.builtin.debug:
        var: listener_repair.stdout
    - name: Verify actual public sign-in page
      ansible.builtin.uri:
        url: https://justisolve.com/?listener_repair=1
        validate_certs: true
        return_content: true
        status_code: 200
      register: public_page
      failed_when: public_page.status != 200 or '/_next/' not in public_page.content or 'data-justisolve-recovery' in public_page.content
    - name: Verify database backed API
      ansible.builtin.uri:
        url: https://justisolve.com/api/health
        validate_certs: true
        return_content: true
        status_code: 200
      register: public_health
      failed_when: public_health.status != 200 or not (public_health.json.ok | default(false))
