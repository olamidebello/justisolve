name: Build JustiSolve Android preview
on:
  push:
    branches: [main]
    paths: ['mobile/android/**', '.github/workflows/android-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # v3 defaults include the retired 'tools' package; request only supported packages.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build and verify development preview
        run: python3 mobile/android/build.py --sdk "$ANDROID_HOME" --signing "$RUNNER_TEMP/preview-signing" --output "$RUNNER_TEMP/justisolve-preview"
      - name: Independently verify preview artifacts
        working-directory: ${{ runner.temp }}/justisolve-preview
        run: |
          sha256sum --check justisolve-preview.apk.sha256
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 justisolve-preview.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs justisolve-preview.apk
          python3 -m json.tool release.json
      - uses: actions/upload-artifact@v4
        with:
          name: justisolve-android-preview
          path: ${{ runner.temp }}/justisolve-preview/*
          if-no-files-found: error
          retention-days: 14
